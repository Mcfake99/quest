# Render Blueprint — free Node web service + free Postgres.
# Dashboard: New > Blueprint > pick this repo.
services:
  - type: web
    name: questforge
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && NITRO_PRESET=node-server npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/auth/ok
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: questforge-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Optional: set to your custom domain / https://<name>.onrender.com.
      # If unset, the app falls back to Render's RENDER_EXTERNAL_URL.
      - key: BETTER_AUTH_URL
        sync: false

databases:
  - name: questforge-db
    plan: free
    region: oregon
    databaseName: questforge
    user: questforge
